[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orderflow-platform"
version = "1.4.2"
description = "Intentionally vulnerable OrderFlow platform for SkyForge testing"
requires-python = ">=3.11"
dependencies = [
  "flask==2.0.1",
  "werkzeug==2.0.1",
  "jinja2==3.0.1",
  "markupsafe==2.0.1",
  "itsdangerous==2.0.1",
  "click==8.0.1",
  "requests==2.25.1",
  "urllib3==1.26.4",
  "idna==2.10",
  "certifi==2020.12.5",
  "chardet==4.0.0",
  "pyjwt==1.7.1",
  "cryptography==3.4.8",
  "paramiko==2.10.1",
  "gunicorn==20.0.4",
  "boto3==1.26.0",
  "botocore==1.29.0"
]

[project.optional-dependencies]
test = ["pytest==8.3.4", "pytest-cov==6.0.0", "behave==1.2.6"]
legacy = ["pyyaml==5.3.1", "pillow==8.2.0", "lxml==4.6.3", "django==3.2.12", "aiohttp==3.8.1", "sqlparse==0.4.1"]

[tool.setuptools.packages.find]
where = ["main"]

[tool.pytest.ini_options]
pythonpath = ["main"]
testpaths = ["unit-tests", "functional-tests/api"]
